<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : l'application occupe tout l'écran sous l'encoche
         de l'iPhone ; les marges de sécurité sont gérées en CSS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- La barre système suit le thème : papier chaud le jour, brun sombre
         la nuit. Un seul theme-color laisserait une bande blanche en haut
         de l'écran en mode sombre. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fffbf6"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#14100e"
    />
    <meta
      name="description"
      content="Apprentissage du chinois mandarin pour francophones, des premiers tons au HSK 3."
    />
    <!-- Permet l'affichage plein écran une fois ajoutée à l'écran d'accueil iOS. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mandarine" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>Mandarine — chinois jusqu’au HSK 3</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Mandarine a besoin de JavaScript : toute l’application fonctionne dans ton
      navigateur, sans serveur.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
