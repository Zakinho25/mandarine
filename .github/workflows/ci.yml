name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `legacy-peer-deps` vient du .npmrc du dépôt : npm 10 plante sinon sur
      # la résolution des dépendances de pair de Vite 8.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pureté de la couche domaine
        run: npm run check:domain

      - name: Accessibilité
        run: npm run check:a11y

      - name: Typage
        run: npx tsc -b

      - name: Tests et couverture de la logique pédagogique
        run: npm run coverage

      - name: Build de production
        run: npm run build

      # Chromium et WebKit seulement. WebKit est le moteur de Safari, donc
      # celui de l'iPhone sur lequel l'application est réellement installée :
      # c'est le navigateur où une régression coûterait le plus cher.
      - name: Navigateurs de test
        run: npx playwright install --with-deps chromium webkit

      - name: Tests de bout en bout
        run: npm run test:e2e

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7
